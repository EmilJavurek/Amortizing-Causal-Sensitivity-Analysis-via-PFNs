[project]
name = "csa-pfn"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt", "experiments/comparisons/vendor/BLearner/LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "einops==0.8.1",
    "huggingface-hub==0.32.2",
    "joblib==1.5.1",
    "matplotlib==3.9.4",
    "networkx==3.2.1",
    "numpy==2.0.2",
    "packaging==25.0",
    "pandas==2.2.3",
    "pyarrow>=24.0.0",
    "pyyaml==6.0.2",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "tensorboard==2.19.0",
    "torch==2.7.0",
    "tqdm==4.67.1",
    "typing-extensions==4.13.2",
]

[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src", experiments = "experiments"}
include-package-data = false

[tool.setuptools.package-data]
"experiments.comparisons.vendor.BLearner" = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tabpfn*", "setting_standard*", "experiments*"]
exclude = ["experiments.configs*"]
namespaces = true
