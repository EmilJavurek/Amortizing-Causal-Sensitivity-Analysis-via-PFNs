# Interface example, not scientific label/training budgets.
run_dir: artifacts/experiment_outputs/example_optimization_kl
dataset_ids_range:
- 1
- 10
dgp_batch_size: 10
lambda_min: 0.08
lambda_max: 2.0
lambda_n: 2
lambda_spacing: log
device: cpu
sensitivity_model: kl
num_mc_samples_train: 32
num_mc_samples_eval: 64
max_steps: 2
num_query_points: 8
flow_tail_bound: 6.0
flow_num_bins: 8
flow_min_bin_width: 0.001
flow_min_bin_height: 0.001
flow_min_derivative: 0.001
loss_reduction: per_dgp_sum
warm_start_lambdas: 'False'
early_stop: false
save_diagnostics: false
save_spline_params: false
query_random_seed: 0
