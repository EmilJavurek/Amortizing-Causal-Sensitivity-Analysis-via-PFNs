run_dir: artifacts/priors/paper/optimization_rosenbaum
dataset_ids_range:
- 1
- 10000
device: cuda:0
save_diagnostics: false
save_spline_params: true
num_query_points: 256
dgp_batch_size: 128
lambda_min: 0.0015
lambda_max: 0.1
lambda_n: 40
lambda_spacing: log
sensitivity_model: rosenbaum
num_mc_samples_train: 128
num_mc_samples_eval: 1024
max_steps: 350
flow_num_bins: 8
flow_tail_bound: 6.0
flow_min_bin_width: 0.001
flow_min_bin_height: 0.001
flow_min_derivative: 0.001
loss_reduction: per_dgp_sum
warm_start_lambdas: 'True'
early_stop: true
use_bucket_forward: 'True'
lr_lambda_schedule: sqrt
lr_lambda_ref: 0.25
lr_lambda_min_mult: 0.4
max_steps_lambda_schedule: inverse_sqrt_lr
max_steps_lambda_max_mult: 2.0
early_stop_min_steps: 100
early_stop_check_every: 25
early_stop_patience: 3
early_stop_abs_tol: 0.0002
early_stop_rel_tol: 0.0005
query_sampling_mode: ordered_proxy
query_random_seed: 0
learning_rate: 0.001
